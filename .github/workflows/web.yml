name: Web

on:
  push:
    branches: [main]
  pull_request:
    paths: ["web/**", "api/**", "docker-compose.yml", ".github/workflows/web.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          working-directory: api

      - name: Contrato de la API (OpenAPI)
        working-directory: api
        run: |
          uv sync --locked
          uv run python -m scripts.openapi > "$RUNNER_TEMP/openapi.json"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Dependencias
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Los tipos de la API están al día
        working-directory: web
        run: |
          OPENAPI="$RUNNER_TEMP/openapi.json" pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::La API cambió y web/src/api/schema.d.ts no. Corre: docker compose exec web corepack pnpm gen:api"
            exit 1
          }

      - name: Tipos
        working-directory: web
        run: pnpm typecheck

      - name: Pruebas
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recorridos en el navegador (Playwright contra la API y la base de verdad)
        run: |
          export PPM_UID=$(id -u) PPM_GID=$(id -g)
          docker compose run --rm e2e

      - name: Registro de los servicios
        if: failure()
        run: docker compose logs --no-color api web

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            web/playwright-report
            web/test-results
