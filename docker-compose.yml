# Todo PPM servidor con un comando:  docker compose up
#   db       PostgreSQL 18 (los datos quedan en el volumen pgdata)
#   migrate  dbmate aplica las migraciones pendientes y termina
#   api      FastAPI en http://localhost:8000 (se recarga sola al editar app/)
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ppm
      POSTGRES_PASSWORD: ppm
      POSTGRES_DB: ppm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppm -d ppm"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://ppm:ppm@db:5432/ppm?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db:ro
    command: ["--wait", "up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://ppm:ppm@db:5432/ppm
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
