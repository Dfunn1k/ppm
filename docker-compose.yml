# Todo PPM con un comando:  docker compose up
#   db       PostgreSQL 18 (los datos quedan en el volumen pgdata)
#   migrate  dbmate aplica las migraciones pendientes y termina
#   api      FastAPI en http://localhost:8000 (se recarga sola al editar api/app/)
#   mailpit  atrapa los correos que envía la API; se ven en http://localhost:8025
#   web      la app web (Vite + React) en http://localhost:5173; /api/… va a la API
# Pruebas, sin instalar nada:  docker compose run --rm pruebas
name: ppm   # nombre fijo: no depende de cómo se llame la carpeta

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ppm
      POSTGRES_PASSWORD: ppm
      POSTGRES_DB: ppm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppm -d ppm"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://ppm:ppm@db:5432/ppm?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./api/db:/db:ro
    command: ["--wait", "up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://ppm:ppm@db:5432/ppm
      APP_URL: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/srv/app
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  web:
    image: node:22.18.0-bookworm-slim
    user: node                       # el mismo usuario (1000) que dueño de la carpeta
    working_dir: /web
    environment:
      API_TARGET: http://api:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      WATCH_POLLING: "false"         # "true" si en WSL la página no se recarga sola
    volumes:
      - ./web:/web
    command: ["sh", "-c", "corepack pnpm install --frozen-lockfile && corepack pnpm dev"]
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "8025:8025"

  pruebas:
    profiles: ["pruebas"]
    build: ./api
    environment:
      DATABASE_URL: postgresql://ppm:ppm@db:5432/ppm
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    volumes:
      - ./api:/src:ro
    command: ["sh", "-c", "cp -r /src /w && cd /w && rm -rf .venv && uv sync --locked -q && uv run pytest -W error"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
