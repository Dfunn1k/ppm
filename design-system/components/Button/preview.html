<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Button</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block">
<style>body{margin:0;padding:16px;background:var(--card);color:var(--foreground);font-family:var(--font-sans)}.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"opsz" 20}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border:0;border-radius:var(--radius-md);font:inherit;cursor:pointer}
button .ms{font-size:20px}
button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.p{background:var(--primary);color:var(--primary-foreground)}
.s{background:var(--secondary);color:var(--secondary-foreground)}
.d{background:var(--destructive);color:var(--destructive-foreground)}
</style></head><body>
<div class="row">
 <button class="p body-strong" type="button"><span class="ms" aria-hidden="true">add</span>Registrar gasto</button>
 <button class="s body-strong" type="button">Cancelar</button>
 <button class="d body-strong" type="button"><span class="ms" aria-hidden="true">archive</span>Archivar categoría</button>
</div>
</body></html>
