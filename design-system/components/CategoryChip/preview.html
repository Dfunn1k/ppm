<!-- @dsCard group="Datos" height=168 subtitle="Ícono y color de account_account" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>CategoryChip</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block">
<style>body{margin:0;padding:16px;background:var(--card);color:var(--foreground);font-family:var(--font-sans)}.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"opsz" 20}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.chip{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:36px;height:36px;border-radius:var(--radius-full);display:grid;place-items:center;color:var(--on-category);flex:none}
.dot .ms{font-size:20px}
.txt{min-width:0}.txt .caption{color:var(--muted-foreground)}
</style></head><body>
<div class="grid">
 <div class="chip"><span class="dot" style="background:var(--cat-2)"><span class="ms" aria-hidden="true">restaurant</span></span><div class="txt"><div class="body-strong">Restaurantes y delivery</div><div class="caption">Comida y bebida</div></div></div>
 <div class="chip"><span class="dot" style="background:var(--cat-9)"><span class="ms" aria-hidden="true">shopping_bag</span></span><div class="txt"><div class="body-strong">Ropa y calzado</div><div class="caption">Compras</div></div></div>
 <div class="chip"><span class="dot" style="background:var(--cat-8)"><span class="ms" aria-hidden="true">home</span></span><div class="txt"><div class="body-strong">Alquiler</div><div class="caption">Vivienda</div></div></div>
 <div class="chip"><span class="dot" style="background:var(--cat-4)"><span class="ms" aria-hidden="true">directions_bus</span></span><div class="txt"><div class="body-strong">Transporte público</div><div class="caption">Transporte</div></div></div>
 <div class="chip"><span class="dot" style="background:var(--cat-10)"><span class="ms" aria-hidden="true">payments</span></span><div class="txt"><div class="body-strong">Salario y facturas</div><div class="caption">Ingresos</div></div></div>
 <div class="chip"><span class="dot" style="background:var(--cat-0)"><span class="ms" aria-hidden="true">help</span></span><div class="txt"><div class="body-strong">Por clasificar</div><div class="caption">Sin categoría todavía</div></div></div>
</div>
</body></html>
