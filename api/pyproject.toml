[project]
name = "ppm-api"  # el paquete de la API dentro del repositorio ppm
version = "0.42.1"
description = "PPM (pan para mayo): servidor de finanzas personales con partida doble"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "python-multipart>=0.0.32",
    "pdfplumber>=0.11",
    "pillow>=11",
    "pillow-heif>=0.20",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
